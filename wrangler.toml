# ---------------------------------------------------------------------------
# Cloudflare Workers config for OpenNext (@opennextjs/cloudflare).
#
# `npm run build:cf` emits `.open-next/worker.js` and `.open-next/assets`;
# this file points Wrangler at that output. Deploy with `npm run deploy`.
#
# Requirements: nodejs_compat plus a compatibility date of 2024-09-23 or later.
# Do not change `main` or `assets` unless you change the build output dir.
# ---------------------------------------------------------------------------
name = "fajarariandi-portfolio"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Self-reference: lets the worker call its own routes, which some Next.js
# data-fetching paths need.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "fajarariandi-portfolio"

# Next.js ISR / incremental cache is stored in R2. Create a bucket and
# uncomment to enable full ISR caching on Workers.
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "fajarariandi-portfolio-cache"

[images]
binding = "IMAGES"

# Non-secret environment only. Secrets (SANITY_API_READ_TOKEN,
# RESEND_API_KEY) belong in `wrangler secret put` or the Workers dashboard —
# never in this file.
[vars]
